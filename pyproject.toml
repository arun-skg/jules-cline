[project]
name = "enterprise-agent"
version = "0.1.0"
description = "Enterprise-grade Python AI Agent Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "loguru>=0.7.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "aioredis>=2.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "qdrant-client>=1.11.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "grpcio>=1.66.0",
    "protobuf>=5.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "apps", "services"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "isort>=5.13.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
